[project]
name = "codex-control"
version = "0.1.0"
description = "Async Python library for puppeteering the `codex app-server` JSON-RPC interface — RL- and auto-research-shaped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rl-agent-work" }]
keywords = ["codex", "rl", "app-server", "jsonrpc", "agent", "puppeteer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=15,<16"]
# Optional compat-only dependency so the legacy ``codex_control.verifiers``
# re-exports work. The real home of the verifiers is :mod:`codex_env`.
verifiers-compat = ["codex-env>=0.1.0"]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "codex-env",
]
dev = [
    "codex-control[websocket,test,verifiers-compat]",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
# codex-env = { path = "../codex-env", editable = true }
codex-env = { git = "https://github.com/cybernetic-physics/codex-env.git" }

[project.urls]
"Source" = "https://github.com/cybernetic-physics/codex-control"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PYI"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true
